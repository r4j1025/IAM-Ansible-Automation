---
- name: ForgeRock OIDC Onboarding
  hosts: localhost
  connection: local
  gather_facts: false
 
  tasks:
 
    - name: Create ForgeRock session token
      command:
        argv:
          - python3
          - "{{ playbook_dir }}/../forgerock/create_token.py"
          - "{{ servicenow_payload.fr_admin_username }}"
          - "{{ servicenow_payload.fr_admin_password }}"
      register: token_result
 
    - name: Parse token response
      set_fact:
        token_json: "{{ token_result.stdout | from_json }}"
 
    - name: Create OAuth client
      command:
        argv:
          - python3
          - "{{ playbook_dir }}/../forgerock/create_client.py"
          - "{{ token_json.token }}"
          - "{{ servicenow_payload | to_json }}"
      register: client_result
      failed_when: false
 
    - name: Show create client output
      debug:
        var: client_result.stdout
 
    - name: Show create client error
      debug:
        var: client_result.stderr
      when: client_result.stderr != ""
 
    - name: Publish debug output
      set_stats:
        data:
          status: "{{ 'SUCCESS' if client_result.rc == 0 else 'FAILED' }}"
          ritm_number: "{{ servicenow_payload.ritm_number }}"
          client_output: "{{ client_result.stdout }}"
          client_error: "{{ client_result.stderr }}"